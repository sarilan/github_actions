      - { regex: "mettons en demeure", poids: 6 }
      - { regex: "dernier avis avant", poids: 5 }
      - { regex: "expulsion", poids: 3 }
      - { regex: "commandement de payer", poids: 6 }
      - { regex: "sous peine de", poids: 3 }
      - { regex: "poursuites", poids: 3 }
      - { regex: "recouvrement contentieux", poids: 4 }
      - { regex: "majoration de 10 ?%", poids: 3 }
  - nom: Convocation
    marqueurs:
      - { regex: "convocation", poids: 6 }
      - { regex: "vous etes convoque", poids: 6 }
      - { regex: "rendez-?vous (est )?fixe", poids: 4 }
      - { regex: "vous presenter le", poids: 4 }
      - { regex: "assemblee generale", poids: 3 }
      - { regex: "ordre du jour", poids: 3 }
      - { regex: "visite (a domicile|d'evaluation)", poids: 3 }
  - nom: Relance
    marqueurs:
      - { regex: "\\brelances?\\b", poids: 5 }
      - { regex: "rappel", poids: 3 }
      - { regex: "reste(nt)? impaye", poids: 4 }
      - { regex: "n'avons pas (recu|enregistre) (votre|le) (reglement|paiement)", poids: 5 }
      - { regex: "sauf erreur", poids: 3 }
      - { regex: "impaye", poids: 3 }
      - { regex: "regularis", poids: 2 }
