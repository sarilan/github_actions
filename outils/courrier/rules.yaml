      - { regex: "nous (vous )?(remercions|demandons) de (nous )?(retourner|transmettre|adresser|fournir)", poids: 4 }
      - { regex: "justificatifs?", poids: 3 }
      - { regex: "dossier incomplet", poids: 5 }
      - { regex: "merci de (nous )?(retourner|renvoyer|joindre)", poids: 4 }
      - { regex: "documents? (suivants?|demandes?)", poids: 3 }
