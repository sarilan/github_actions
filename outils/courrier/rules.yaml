urgence:
  base_par_type:
    "Mise en demeure": 4
    "Convocation": 3
    "Relance": 3
    "Demande de pièces": 3
    "Facture": 2
    "Décision": 2
    "Information": 1
    "Autre": 2
  modificateurs:
    delai_depasse: { niveau_minimum: 4, motif: "date limite dépassée" }
    delai_7_jours: { ajout: 1, motif: "date limite sous 7 jours" }
    delai_15_jours: { ajout: 0, motif: "date limite sous 15 jours" }
    montant_eleve: { seuil: 500, ajout: 1, motif: "montant supérieur à 500 €", types_concernes: ["Facture", "Relance", "Mise en demeure"] }
    organisme_critique: { ajout: 1, motif: "organisme à enjeu (impôts, recouvrement, justice)" }
    mots_cles_sanction:
      ajout: 1
      motif: "mention d'une sanction ou d'une interruption de droits"
      regex:
        - "suspension"
        - "radiation"
        - "\\bsaisie\\b"
        - "coupure"
        - "resiliation (de plein droit|du contrat)"
        - "penalite"
        - "majoration"
        - "interruption (de|des) (droits|versements)"
        - "expulsion"
        - "commandement"
    information_sans_delai: { niveau_maximum: 1, motif: "information sans délai d'action" }
