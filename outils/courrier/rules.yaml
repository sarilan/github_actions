# Règles de classification du courrier — service Relais
#
# Trois sections :
#   organismes : reconnaissance de l'expéditeur (motifs sur en-têtes, SIRET/SIREN, adresses,
#                formulations propres). Les motifs sont des expressions régulières appliquées
#                au texte normalisé (minuscules, sans accents, espaces réduits).
#                « poids » : contribution au score ; un motif trouvé dans l'en-tête (15
#                premières lignes) compte double. L'organisme au meilleur score est retenu ;
#                la confiance est le rapport entre ce score et le score maximal possible.
#   types      : type de document, avec marqueurs pondérés et un ordre de priorité en cas
#                d'égalité (une mise en demeure contient aussi le mot « facture »).
#   urgence    : niveau de base par type, puis modificateurs explicites (délai, montant,
#                organisme critique, mots-clés de sanction). Le niveau est borné entre 1 et 4.
#
# Pour ajouter un organisme : copier un bloc, choisir un identifiant unique (minuscules,
# tirets), renseigner au moins deux motifs distinctifs (nom + adresse ou SIREN + formule
# d'usage), ajouter un courrier d'exemple dans tests/corpus/ et sa ligne dans
# tests/corpus/attendus.yaml, puis lancer les tests.

